name: Application CI/CD

on:
  push:
    branches:
      - main
      - prod
      - staging
      - develop

  pull_request:
    branches:
      - main
      - prod
      - staging
      - develop

permissions:
  contents: read

env:
  DOCKERHUB_IMAGE: docker.io/nitace/globallyhub-app
  GITOPS_REPOSITORY: Nitesh0ne/GloballyHub-GitOps

jobs:
  validate:
    name: Validate Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}

  publish:
    name: Publish and Update GitOps
    runs-on: ubuntu-latest
    needs: validate

    if: >
      github.event_name == 'push' &&
      (
        github.ref_name == 'main' ||
        github.ref_name == 'prod' ||
        github.ref_name == 'staging' ||
        github.ref_name == 'develop'
      )

    environment:
      name: ${{ (github.ref_name == 'main' || github.ref_name == 'prod') && 'production' || 'staging' }}

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}

      - name: Determine GitOps environment
        id: environment
        shell: bash
        run: |
          echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "values_file=helm/application/values.yaml" >> "$GITHUB_OUTPUT"

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPOSITORY }}
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: gitops

      - name: Verify GitOps values file
        working-directory: gitops
        env:
          VALUES_FILE: ${{ steps.environment.outputs.values_file }}
        run: |
          if [[ ! -f "$VALUES_FILE" ]]; then
            echo "::error::GitOps values file does not exist: $VALUES_FILE"
            echo "Available files:"
            find . -type f \( -name '*.yaml' -o -name '*.yml' \) | sort
            exit 1
          fi

      - name: Update GitOps image
        shell: bash
        env:
          VALUES_FILE: ${{ steps.environment.outputs.values_file }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python3 - <<'PY'
